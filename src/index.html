<!doctype html>
<html lang="en">
    <head>
        <title>CCBM App</title>
        <meta charset="utf-8">
        <meta
            name="description"
            content="Aplicación CCBM, especializada en almacenar y gestionar transcripciones de videos, facilitando la organización y acceso a contenido hablado en formato de texto. Ideal para profesionales que requieren documentación precisa y accesible de grabaciones en video.">
        <meta
            name="keywords"
            content="transcripción de videos, almacenamiento de transcripciones, gestión de transcripciones, transcripciones de video, conversión de video a texto, transcripción automática, documentación de videos, organización de transcripciones">
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">

        <base href="/">

        <!-- Favicon -->
        <link
            rel="icon"
            type="image/png"
            href="favicon-16x16.png">
        <link
            rel="icon"
            type="image/png"
            href="favicon-32x32.png">

        <!-- Fonts -->
        <link
            href="assets/fonts/inter/inter.css"
            rel="stylesheet">

        <link
            href="https://fonts.gstatic.com"
            rel="preconnect">
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet">

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet">

        <!-- Splash screen styles -->
        <link
            href="assets/styles/splash-screen.css"
            rel="stylesheet">

    </head>

    <body>

        <!-- Splash screen -->
        <fuse-splash-screen>
            <img
                src="assets/images/logo/Logo-gris.png"
                alt="CCBM LOGO">
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>

    </body>

</html>
