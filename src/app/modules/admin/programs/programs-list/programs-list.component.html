<div class="absolute inset-0 flex flex-col min-w-0 overflow-hidden">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row flex-0 sm:items-center sm:justify-between p-6 pb-22 sm:pt-12 sm:pb-28 sm:px-10 bg-default dark:bg-transparent">
        <div class="flex-1 min-w-0">
            <!-- Breadcrumbs -->
            <div>
                <div class="hidden sm:flex flex-wrap items-center font-medium">
                    <!-- back button -->
                    <a class="inline-flex items-center -ml-1.5 mr-2 text-secondary font-medium" [routerLink]="'./..'">
                        <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
                        <span class="ml-1">Volver</span>
                    </a>
                    <div>
                        <a class="whitespace-nowrap text-primary-500">Programas</a>
                    </div>
                    <div class="flex items-center ml-1 whitespace-nowrap">
                        <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_mini:chevron-right'"></mat-icon>
                        <span class="ml-1 text-secondary">{{programa.titulo}}</span>
                    </div>
                </div>
                <div class="flex sm:hidden">
                    <a class="inline-flex items-center -ml-1.5 text-secondary font-medium" [routerLink]="'./..'">
                        <mat-icon class="icon-size-5 text-secondary" [svgIcon]="'heroicons_solid:chevron-left'"></mat-icon>
                        <span class="ml-1">Volver</span>
                    </a>
                </div>
            </div>
            <!-- Title -->
            <div class="mt-2 flex flex-col">
                <h2 class="text-3xl md:text-4xl font-extrabold tracking-tight leading-7 sm:leading-10 truncate">
                    {{programa.titulo}} - {{programa.idioma}}
                </h2>
                <!-- cantidad capitulos -->
                <div class="w-full flex flex-row">
                    <span class="text-lg text-gray-500 font-semibold">{{programa.productora}}</span>
                </div>
            </div>
        </div>
        <!-- Actions -->
        <div class="flex shrink-0 items-center mt-6 sm:mt-0 sm:ml-4">
            <button mat-icon-button (click)="matDrawer.toggle()">
                <mat-icon [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
            </button>
        </div>
    </div>

    <mat-drawer-container class="flex flex-col flex-auto -mt-16 rounded-t-2xl shadow bg-card">

        <!-- Drawer -->
        <mat-drawer class="w-72 dark:bg-gray-900" [autoFocus]="false" [mode]="drawerMode" [opened]="drawerOpened" #matDrawer>
            <div class="w-full flex flex-col justify-center mt-4">
                <!-- program image -->
                <div class="flex justify-center p-2">
                    <img class="w-full h-44 rounded-md" [src]="programa.imagen" alt="programa.imagen">
                </div>

                <!-- program idioma -->
                <!-- <div class="flex justify-center mt-2">
                    <span class="text-lg text-gray-500">{{programa.idioma}}</span>
                </div> -->

                <!-- program total capitulos -->
                <div class="flex justify-center mt-2">
                    <span class="text-lg text-gray-500 font-semibold">{{totalFichas}} Capítulos</span>
                </div>

                <!-- mat divider -->
                <div class="w-full px-4">
                    <mat-divider class="mt-4 px-3"></mat-divider>
                </div>

                <!-- productora -->
                <!-- <div class="flex justify-center mt-2">
                    <span class="text-md text-gray-500 text-center">{{programa.productora}}</span>
                </div> -->

                <!-- years emision list -->
                <div class="flex justify-center mt-2">
                    <div class="w-full flex flex-col gap-y-2 px-2">
                        <ng-container *ngFor="let item of emisiones; index as i">
                            <a class="w-full p-2 border border-l-8 border-zinc-300 hover:bg-zinc-100 hover:shadow-md cursor-pointer" [routerLink]="['./', item['año']]" (click)="setyear(item['año'])">
                                <h1 class="text-lg font-bold tracking-normal truncate">{{item['año'] !== 'undefined'? item['año']: 'Sin fecha'}}</h1>
                                <h2 class="text-md font-medium text-secondary">{{item.cantidad}} Episodios</h2>
                            </a>
                        </ng-container>
                    </div>
                </div>

            </div>
        </mat-drawer>

        <!-- Drawer content -->
        <mat-drawer-content class="flex flex-col overflow-hidden">

            <!-- Main -->
            <div class="flex-auto p-6 sm:p-10 overflow-y-auto" cdkScrollable>

                <!-- CONTENT GOES HERE -->
                <div class="w-full">
                    <router-outlet></router-outlet>
                </div>

            </div>

        </mat-drawer-content>

    </mat-drawer-container>

</div>
