<h2 mat-dialog-title [ngStyle]="colorStyles" class="text-2xl font-bold">Sinopsis - {{nombreFicha}}</h2>
<mat-dialog-content class="mat-typography">
    <div class="flex flex-wrap flex-row gap-2 w-full">
        <div [innerHTML]="safeSinopsis"></div>
    </div>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button mat-dialog-close [ngStyle]="backgroundStyles">Cerrar</button>
</mat-dialog-actions>
